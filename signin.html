<!DOCTYPE html>
<html>
<head>
  <title>Join AscendX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: rgb(15, 31, 61);
      color: white;
      font-family: Arial, sans-serif;
    }

    .parentContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      padding: 20px;
      border: 1px solid gray;
      width: 400px;
      border-radius: 10px;
      text-align: center;
    }

    input {
      border: 2px solid silver;
      border-radius: 10px;
      height: 40px;
      width: 90%;
      margin-bottom: 12px;
      padding: 0 10px;
    }

    .btn {
      width: 90%;
      height: 40px;
      background: blue;
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
      margin-bottom: 10px;
      
    }

    .btn:disabled {
      background: gray;
      cursor: not-allowed;
    }

    #errorMsg {
      color: red;
      font-size: 14px;
    }
    .checkbox{
       height: 20px;
       
      
    }
    a{
        color: white;
        font-weight: bold;
        
    }
   
  </style>
</head>

<body>
  <div class="parentContainer">
    <div class="container">
      <h1>Log In</h1>
      <p>Welcome back! New exiting things are waiting for you. Login back!</p>
      

      <form id="signupForm">
        <p id="errorMsg"></p>

        
        <input type="email" class="email" placeholder="Email" required>
        <input type="password" class="password" placeholder="Password" required>
      

        <button class="btn submitBtn" type="submit">Login</button>
        <button class="btn googleBtn" type="button">Login with Google</button>
        <a href="getStarted.html">Don't have an account? SignUp </a>
      </form>
      <h6>&copy; 2026 AscendX, All Rights Reserved</h6>
    <b><p>Learn.Develop.Ascend</p> </b>
    
    </div>
     
  </div>
  
  
   
  
  
  
  
  

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

   
    const firebaseConfig = {
      apiKey: "AIzaSyBYbc5UMPjL5Ov9HIsOi2yYz6EH2HiM1dc",
  authDomain: "ascendx-2992d.firebaseapp.com",
  projectId: "ascendx-2992d",
  storageBucket: "ascendx-2992d.appspot.com",
  messagingSenderId: "190104997680",
  appId: "1:190104997680:web:5ed91efc9e17fc059942f5",
  measurementId: "G-19XTLCD45V"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("signupForm");
    const errorMsg = document.getElementById("errorMsg");
    const submitBtn = document.querySelector(".submitBtn");
    const googleBtn = document.querySelector(".googleBtn");

    // 🔐 SIGN UP WITH EMAIL
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      
      const email = document.querySelector(".email").value.trim();
      const password = document.querySelector(".password").value;
      

      errorMsg.textContent = "";

     

      

      submitBtn.disabled = true;
      submitBtn.textContent = "Signing you in...";

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        window.location.href = "dashboard.html";

      } catch (error) {
        handleError(error);
      }

      submitBtn.disabled = false;
      submitBtn.textContent = "LogIn";
    });

    // 🔐 GOOGLE SIGN UP
    googleBtn.addEventListener("click", async () => {
      const provider = new GoogleAuthProvider();

      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        window.location.href = "dashboard.html";

      } catch (error) {
        handleError(error);
      }
    });

    // js errs
    function handleError(error) {
      console.log(error.code);

      switch (error.code) {
        case "auth/user-not-found":
        errorMsg.textContent = "Incorrect email"
        break;
        case "auth/wrong-password":
        errorMsg.textContent = "Wrong Password, please try once more."
        break;
        case "auth/invalid-credential":
        errorMsg.textContent = "Wrong credentials, please please try again."
        break;
        
        case "auth/invalid-email":
          errorMsg.textContent = "Invalid email address.";
          break;
        default:
          errorMsg.textContent = "Something went wrong. Try again";
      }
    }
  </script>
</body>
</html>
